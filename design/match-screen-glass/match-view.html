<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Match view</title><style>
body{margin:0}
a{color:#FFD60A}a:hover{color:#fff}
.pitch{background:#1f6b2c url(grass-background.jpg) center top/cover no-repeat}
.glass{background:rgba(255,255,255,0.11);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 10px 30px rgba(0,0,0,0.28)}
.ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0;font:inherit}
.ib svg,.cap svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cap button{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.score-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;padding:0;font:inherit;color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;letter-spacing:0.02em}
.score-btn span.disc{width:62px;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center}
.score-btn svg{width:28px;height:28px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>

<div class="pitch" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#fff">

    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">

      <div class="glass" style="position:relative;border-radius:32px;padding:14px 14px 16px 14px;display:flex;flex-direction:column;gap:6px">

          <button class="score-btn" style="position:absolute;left:16px;top:50%;transform:translateY(-50%)" aria-label="Add goal">
            <span class="disc" style="background:rgba(48,209,88,0.22);border:1px solid rgba(48,209,88,0.6);color:#30D158"><svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M5.5 21V3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="5.5" cy="3" r="1.3" fill="currentColor"/><path d="M6.5 4.8c2.3-1.4 4.4-.6 6.4.3s3.9 1.2 6.1-.1c.3-.2.7 0 .7.4v8.1c0 .3-.1.5-.4.7-2.2 1.3-4.2 1-6.3.1s-4.2-1.7-6.5-.3z" fill="currentColor"/></svg></span>
          </button>
          <div style="font-size:64px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1">5<span style="color:#FFD60A;padding:0 3px">-</span>17</div>
          <button class="score-btn" style="position:absolute;right:16px;top:50%;transform:translateY(-50%)" aria-label="Add point">
            <span class="disc" style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.55);color:#fff"><svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M5.5 21V3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="5.5" cy="3" r="1.3" fill="currentColor"/><path d="M6.5 4.8c2.3-1.4 4.4-.6 6.4.3s3.9 1.2 6.1-.1c.3-.2.7 0 .7.4v8.1c0 .3-.1.5-.4.7-2.2 1.3-4.2 1-6.3.1s-4.2-1.7-6.5-.3z" fill="currentColor"/></svg></span>
          </button>
        </div>
        <div style="display:flex;justify-content:center;padding-top:4px">


          <button class="glass" style="height:36px;padding:0 14px 0 10px;border-radius:18px;box-shadow:none;display:flex;align-items:center;gap:5px;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer" aria-label="More events"><svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>More</button>
        </div>
      </div>
    
      <div class="glass" style="position:relative;border-radius:32px;padding:14px 14px 16px 14px;display:flex;flex-direction:column;gap:6px">
        <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding-top:2px">
          <div></div>
          <div style="font-size:20px;font-weight:700;letter-spacing:0.01em;text-align:center">Brian Borus</div>
          <div style="justify-self:end;font-size:17px;font-weight:700;padding:4px 12px;border-radius:15px;background:rgba(0,0,0,0.28);color:rgba(255,255,255,0.9);font-variant-numeric:tabular-nums">5 pts</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center">
          <button class="score-btn" style="position:absolute;left:16px;top:50%;transform:translateY(-50%)" aria-label="Add goal">
            <span class="disc" style="background:rgba(48,209,88,0.22);border:1px solid rgba(48,209,88,0.6);color:#30D158"><svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M5.5 21V3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="5.5" cy="3" r="1.3" fill="currentColor"/><path d="M6.5 4.8c2.3-1.4 4.4-.6 6.4.3s3.9 1.2 6.1-.1c.3-.2.7 0 .7.4v8.1c0 .3-.1.5-.4.7-2.2 1.3-4.2 1-6.3.1s-4.2-1.7-6.5-.3z" fill="currentColor"/></svg></span>
          </button>
          <div style="font-size:64px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1">1<span style="color:#FFD60A;padding:0 3px">-</span>2</div>
          <button class="score-btn" style="position:absolute;right:16px;top:50%;transform:translateY(-50%)" aria-label="Add point">
            <span class="disc" style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.55);color:#fff"><svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M5.5 21V3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="5.5" cy="3" r="1.3" fill="currentColor"/><path d="M6.5 4.8c2.3-1.4 4.4-.6 6.4.3s3.9 1.2 6.1-.1c.3-.2.7 0 .7.4v8.1c0 .3-.1.5-.4.7-2.2 1.3-4.2 1-6.3.1s-4.2-1.7-6.5-.3z" fill="currentColor"/></svg></span>
          </button>
        </div>
        <div style="display:flex;justify-content:center;padding-top:4px">


          <button class="glass" style="height:36px;padding:0 14px 0 10px;border-radius:18px;box-shadow:none;display:flex;align-items:center;gap:5px;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer" aria-label="More events"><svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>More</button>
        </div>
      </div>
    
  </div>

  <div class="glass" style="position:absolute;left:8px;right:8px;bottom:8px;border-radius:38px;padding:8px 20px 22px 22px;display:flex;flex-direction:column;gap:8px">
    <div style="align-self:center;width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,0.4)"></div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:20px;font-weight:700">1st half</div>
        <div style="font-size:14px;color:rgba(255,255,255,0.7)">Swipe up for match log</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="glass ib" style="box-shadow:none" aria-label="Share result"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/></svg></button>
        <button class="glass ib" style="box-shadow:none" aria-label="Match log"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="3"/></svg></button>
      </div>
    </div>
  </div>
</div>

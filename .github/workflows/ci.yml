name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MatchCore must stay Foundation-only, so it is built and tested on Linux too.
  matchcore-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test MatchCore
        working-directory: MatchCore
        run: swift test

  app-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test MatchCore
        working-directory: MatchCore
        run: swift test
      # Runs the app's tests (MatchTrackerTests) on whichever iPhone simulator the runner has.
      - name: Test app
        run: |
          DEVICE=$(xcrun simctl list devices available iPhone | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using $DEVICE"
          xcodebuild test \
            -project MatchTracker/MatchTracker.xcodeproj \
            -scheme MatchTracker \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
